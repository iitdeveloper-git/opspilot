[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opspilot"
version = "0.2.0"
description = "AI-powered open-source infrastructure monitoring, ChatOps, and automation platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "IITDEVELOPER", email = "info@iitdeveloper.com" }
]
keywords = ["devops", "monitoring", "chatops", "telegram", "docker", "ai", "infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.8",
    "docker>=7.0.0",
    "aiogram>=3.5.0",
    "aiohttp>=3.9.5",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "cryptography>=42.0.5",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.25.0",
    "anthropic>=0.25.0",
    "google-generativeai>=0.5.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
opspilot = "opspilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# aiogram's CallbackQuery.message is typed as Message | InaccessibleMessage | None,
# requiring exhaustive narrowing that makes handler code unreadable.
# These are library type limitations, not bugs in our code.
module = "opspilot.chatops.telegram.*"
ignore_errors = true
