name: OpsPilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[ai,dev]"

      - name: Run Pytest
        run: |
          uv run pytest -v

  notify-on-failure:
    name: Notify CI Failure
    needs: [test]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram CI Failure Notification
        uses: iitdeveloper-git/deploykit/actions/notify@v1
        with:
          channel: telegram
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          app_name: "OpsPilot"
          environment: "CI / Test Suite"
          status: "failure"
          release_tag: ${{ github.ref_name }}
          app_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          custom_message: "❌ OpsPilot CI pipeline failed on main branch."
