name: OpsPilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff & Mypy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[ai,dev]"

      - name: Ruff Lint
        run: uv run ruff check src/ tests/

      - name: Ruff Format Check
        run: uv run ruff format --check src/ tests/

      - name: Mypy Type Check
        run: uv run mypy src/

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit & dependencies
        run: |
          uv venv
          uv pip install pip-audit -e ".[ai,dev]"

      - name: Dependency Vulnerability Audit
        run: uv run pip-audit

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[ai,dev]"

      - name: Run Pytest with Coverage
        run: |
          uv run pytest -v --cov=src/opspilot --cov-report=term-missing --cov-report=xml

  docker-validate:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: opspilot:ci-validate

  notify-on-failure:
    name: Notify CI Failure
    needs: [lint, security-scan, test, docker-validate]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram CI Failure Notification
        uses: iitdeveloper-git/deploykit/actions/notify@v1
        with:
          channel: telegram
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          app_name: "OpsPilot"
          environment: "CI / Test Suite"
          status: "failure"
          release_tag: ${{ github.ref_name }}
          app_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          custom_message: "❌ OpsPilot CI pipeline failed on main branch."
