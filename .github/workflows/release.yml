name: OpsPilot Build & Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production VPS
    needs: [build-and-push]
    runs-on: ubuntu-latest
    # Requires a GitHub Environment named "production" with required reviewers / protection rules.
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # DEPLOY_SSH_KEY: private key for the deployment user (required secret)
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          # DEPLOY_SSH_KNOWN_HOSTS: output of `ssh-keyscan <host>` captured at setup time.
          # Store as a repository/environment secret. Never disable host key verification.
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via SSH & Docker Compose (Production)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          # Fail immediately if required secrets are not set
          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ]; then
            echo "::error::DEPLOY_HOST and DEPLOY_USER secrets must be configured in the 'production' environment."
            exit 1
          fi

          echo "Deploying OpsPilot ${IMAGE_TAG} to ${DEPLOY_HOST}..."
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" bash -s << EOF
            set -euo pipefail

            mkdir -p /opt/opspilot
            cd /opt/opspilot

            # Pull the exact released image — fail hard if the pull fails
            sudo docker pull ghcr.io/${{ github.repository }}:${IMAGE_TAG}

            # Deploy using production Compose file (references GHCR image, not build: .)
            if [ -f docker-compose.prod.yml ]; then
              IMAGE_TAG=${IMAGE_TAG} sudo --preserve-env=IMAGE_TAG docker compose \
                -f docker-compose.prod.yml up -d --remove-orphans
            else
              echo "docker-compose.prod.yml not found on host. Aborting."
              exit 1
            fi
          EOF

  notify-success:
    name: Notify Deployment Success
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Release Notification
        uses: iitdeveloper-git/deploykit/actions/notify@v1
        with:
          channel: telegram
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          app_name: "OpsPilot"
          environment: "OVH VPS Production"
          status: "success"
          release_tag: ${{ github.ref_name }}
          app_url: "https://github.com/${{ github.repository }}"
          custom_message: "🚀 OpsPilot ${{ github.ref_name }} built, published to GHCR, and deployed to VPS successfully."

  notify-failure:
    name: Notify Deployment Failure
    needs: [build-and-push, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Failure Notification
        uses: iitdeveloper-git/deploykit/actions/notify@v1
        with:
          channel: telegram
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          app_name: "OpsPilot"
          environment: "OVH VPS Production"
          status: "failure"
          release_tag: ${{ github.ref_name }}
          app_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          custom_message: "❌ OpsPilot deploy pipeline failed during build or rollout."
