name: OpsPilot Docker Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-release:
    name: Notify Release
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Release Notification
        uses: iitdeveloper-git/deploykit/actions/notify@v1
        with:
          channel: telegram
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          app_name: "OpsPilot"
          environment: "GitHub Packages / Release"
          status: "success"
          release_tag: ${{ github.ref_name }}
          app_url: "https://github.com/${{ github.repository }}/pkgs/container/opspilot"
          custom_message: "🚀 New OpsPilot Docker container image published to GHCR."

  notify-failure:
    name: Notify Release Failure
    needs: [build-and-push]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Failure Notification
        uses: iitdeveloper-git/deploykit/actions/notify@v1
        with:
          channel: telegram
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          app_name: "OpsPilot"
          environment: "GitHub Packages / Release"
          status: "failure"
          release_tag: ${{ github.ref_name }}
          app_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          custom_message: "❌ OpsPilot Docker release build failed."
