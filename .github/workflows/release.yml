name: OpsPilot Build & Auto-Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Auto-Deploy to VPS
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH & Docker Compose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '149.56.101.2' }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          echo "Connecting to VPS ${VPS_HOST}..."
          ssh -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" bash -c "'
            set -euo pipefail
            mkdir -p /opt/opspilot

            # Pull latest OpsPilot image from GHCR
            sudo docker pull ghcr.io/${{ github.repository }}:${IMAGE_TAG} || true
            sudo docker pull ghcr.io/${{ github.repository }}:latest || true

            # If compose file exists, restart container with latest image
            if [ -f /opt/opspilot/docker-compose.yml ]; then
              cd /opt/opspilot
              sudo docker compose up -d --remove-orphans
            fi

            # Clean dangling images
            sudo docker image prune -f >/dev/null 2>&1 || true
          '"

  notify-success:
    name: Notify Deployment Success
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Release Notification
        uses: iitdeveloper-git/deploykit/actions/notify@v1
        with:
          channel: telegram
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          app_name: "OpsPilot"
          environment: "OVH VPS Production"
          status: "success"
          release_tag: ${{ github.ref_name }}
          app_url: "https://github.com/${{ github.repository }}"
          custom_message: "🚀 OpsPilot ${{ github.ref_name }} built, published to GHCR, and auto-deployed to VPS successfully."

  notify-failure:
    name: Notify Deployment Failure
    needs: [build-and-push, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Failure Notification
        uses: iitdeveloper-git/deploykit/actions/notify@v1
        with:
          channel: telegram
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          app_name: "OpsPilot"
          environment: "OVH VPS Production"
          status: "failure"
          release_tag: ${{ github.ref_name }}
          app_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          custom_message: "❌ OpsPilot auto-deploy pipeline failed during build or rollout."
